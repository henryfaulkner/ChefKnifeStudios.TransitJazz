name: Server CI/CD

on:
  push:
    branches: [main, 054-centralized-logging, 055-database]

env:
  REGISTRY: chefknife.azurecr.io
  IMAGE_NAME: chefknifestudios.martajazz.server.webapi
  MIGRATION_IMAGE_NAME: chefknifestudios.martajazz.server.data
  CONTAINER_APP_NAME: marta-jazz-dev-ca-server
  RESOURCE_GROUP: marta-jazz-dev-rg

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.set-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build Docker image
        env:
          CONTAINER_REGISTRY: ${{ env.REGISTRY }}
          CONTAINER_TAG: ${{ github.sha }}
        run: docker compose build

      - name: Build database migration image
        run: docker build --file ./src/Server/ChefKnifeStudios.TransitJazz.Server.Data/Dockerfile --tag ${{ env.REGISTRY }}/${{ env.MIGRATION_IMAGE_NAME }}:${{ github.sha }} .

      - name: Validate historical collection is disabled by default
        run: |
          test "$(jq -r '.HistoricalStatistics.Enabled' src/Server/ChefKnifeStudios.TransitJazz.Server.WebAPI/appsettings.json)" = "false"
          test "$(jq -r '.HistoricalStatistics.DryRun' src/Server/ChefKnifeStudios.TransitJazz.Server.WebAPI/appsettings.json)" = "true"

      - name: Set image tag output
        id: set-tag
        run: echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Push images
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.REGISTRY }}/${{ env.MIGRATION_IMAGE_NAME }}:${{ github.sha }}

  migrate-database:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Run database migrations
        env:
          ConnectionStrings__TransitJazzDB: ${{ secrets.TRANSITJAZZ_DB_CONNECTION_STRING }}
        run: |
          if [ -z "$ConnectionStrings__TransitJazzDB" ]; then
            echo "::error::TRANSITJAZZ_DB_CONNECTION_STRING is not configured"
            exit 1
          fi

          docker run --rm \
            --env ConnectionStrings__TransitJazzDB \
            ${{ env.REGISTRY }}/${{ env.MIGRATION_IMAGE_NAME }}:${{ needs.build-and-push.outputs.image-tag }}

  deploy:
    # The migration job is an explicit prerequisite; schema is applied before
    # the server revision can receive traffic. Historical writes stay disabled
    # until the operator release gates approve them.
    needs: [build-and-push, migrate-database]
    runs-on: ubuntu-latest
    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Update Container App
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az containerapp update --name ${{ env.CONTAINER_APP_NAME }} --resource-group ${{ env.RESOURCE_GROUP }} --image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.image-tag }}
