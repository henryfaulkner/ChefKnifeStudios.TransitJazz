name: Server CI/CD

on:
  push:
    branches: [main, 054-centralized-logging, 055-database, 056-city-transit-type-insights]

env:
  REGISTRY: chefknife.azurecr.io
  IMAGE_NAME: chefknifestudios.martajazz.server.webapi
  MIGRATION_IMAGE_NAME: chefknifestudios.martajazz.server.data
  CONTAINER_APP_NAME: marta-jazz-dev-ca-server
  RESOURCE_GROUP: marta-jazz-dev-rg

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.set-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build Docker image
        env:
          CONTAINER_REGISTRY: ${{ env.REGISTRY }}
          CONTAINER_TAG: ${{ github.sha }}
        run: docker compose build

      - name: Build database migration image
        run: docker build --file ./src/Server/ChefKnifeStudios.TransitJazz.Server.Data/Dockerfile --tag ${{ env.REGISTRY }}/${{ env.MIGRATION_IMAGE_NAME }}:${{ github.sha }} .

      - name: Validate historical collection is disabled by default
        run: |
          test "$(jq -r '.HistoricalStatistics.Enabled' src/Server/ChefKnifeStudios.TransitJazz.Server.WebAPI/appsettings.json)" = "false"
          test "$(jq -r '.HistoricalStatistics.DryRun' src/Server/ChefKnifeStudios.TransitJazz.Server.WebAPI/appsettings.json)" = "true"

      - name: Validate city category capture is disabled by default
        run: |
          test "$(jq -r '.CityCategoryInsights.Enabled' src/Server/ChefKnifeStudios.TransitJazz.Server.WebAPI/appsettings.json)" = "false"
          test "$(jq -r '.CityCategoryInsights.DisabledCities | length' src/Server/ChefKnifeStudios.TransitJazz.Server.WebAPI/appsettings.json)" = "0"
          test "$(jq -r '.CityCategoryInsights.Enabled' src/Server/ChefKnifeStudios.TransitJazz.Server.TransitDataWorker/appsettings.json)" = "false"
          test "$(jq -r '.CityCategoryInsights.DisabledCities | length' src/Server/ChefKnifeStudios.TransitJazz.Server.TransitDataWorker/appsettings.json)" = "0"
          test "$(jq -r '.parameters.enableCityCategoryInsights.defaultValue' bicep/main.json)" = "false"
          test "$(jq -r '.parameters.cityCategoryInsightsDisabledCities.defaultValue | length' bicep/main.json)" = "0"
          grep -q 'name: "city_category_minute_statistics"' src/Server/ChefKnifeStudios.TransitJazz.Server.Data/Migrations/20261001204629_CreateCityCategoryStatistics.cs
          grep -q 'name: "city_category_hour_statistics"' src/Server/ChefKnifeStudios.TransitJazz.Server.Data/Migrations/20261001204629_CreateCityCategoryStatistics.cs
          ! grep -Eiq 'migrationBuilder\.Sql|city_minute_statistics|gtfs|route' src/Server/ChefKnifeStudios.TransitJazz.Server.Data/Migrations/20261001204629_CreateCityCategoryStatistics.cs

      - name: Set image tag output
        id: set-tag
        run: echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Push images
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.MIGRATION_IMAGE_NAME }}:${{ github.sha }}

  deploy:
    # Approve server-dev only after applying and verifying migrations from an
    # address allowed by PostgreSQL. Historical writes stay disabled until the
    # separate collector release gates approve them.
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: server-dev
    steps:
      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Update Container App
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az containerapp update --name ${{ env.CONTAINER_APP_NAME }} --resource-group ${{ env.RESOURCE_GROUP }} --image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.image-tag }}

      - name: Promote deployed server image
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.image-tag }}
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.image-tag }} ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
