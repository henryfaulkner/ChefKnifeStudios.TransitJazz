name: Server CI/CD

on:
  push:
    branches: [main, migration/linode-server-hosting]
  workflow_dispatch:

env:
  REGISTRY: chefknife.azurecr.io
  IMAGE_NAME: chefknifestudios.martajazz.server.webapi
  MIGRATION_IMAGE_NAME: chefknifestudios.martajazz.server.data

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.set-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test server and worker
        run: |
          dotnet test src/Server/ChefKnifeStudios.TransitJazz.Server.WebAPI.Tests -c Release
          dotnet test src/Server/ChefKnifeStudios.TransitJazz.Server.TransitDataWorker.Tests -c Release

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build Docker image
        env:
          CONTAINER_REGISTRY: ${{ env.REGISTRY }}
          CONTAINER_TAG: ${{ github.sha }}
        run: docker compose build

      - name: Build database migration image
        run: docker build --file ./src/Server/ChefKnifeStudios.TransitJazz.Server.Data/Dockerfile --tag ${{ env.REGISTRY }}/${{ env.MIGRATION_IMAGE_NAME }}:${{ github.sha }} .

      - name: Validate historical collection is disabled by default
        run: |
          test "$(jq -r '.HistoricalStatistics.Enabled' src/Server/ChefKnifeStudios.TransitJazz.Server.WebAPI/appsettings.json)" = "false"
          test "$(jq -r '.HistoricalStatistics.DryRun' src/Server/ChefKnifeStudios.TransitJazz.Server.WebAPI/appsettings.json)" = "true"

      - name: Validate route-hour settings and schema-only migration
        run: |
          test "$(jq -r '.HistoricalStatistics.RouteHours.MaxRoutesPerCityHour' src/Server/ChefKnifeStudios.TransitJazz.Server.WebAPI/appsettings.json)" = "4096"
          test "$(jq -r '.HistoricalStatistics.RouteHours.QueueCapacity' src/Server/ChefKnifeStudios.TransitJazz.Server.WebAPI/appsettings.json)" = "16"
          ! jq -e '.HistoricalStatistics.RouteHours | has("Enabled") or has("DryRun") or has("Cities") or has("DisabledCities")' src/Server/ChefKnifeStudios.TransitJazz.Server.WebAPI/appsettings.json
          route_migration=src/Server/ChefKnifeStudios.TransitJazz.Server.Data/Migrations/20261010151240_CreateCityRouteHourStatistics.cs
          test "$(grep -c 'migrationBuilder.CreateTable(' "$route_migration")" -eq 1
          test "$(grep -c 'migrationBuilder.CreateIndex(' "$route_migration")" -eq 1
          grep -q 'name: "city_route_hour_statistics"' "$route_migration"
          route_migration_up=$(awk '/protected override void Up\(/ { in_up=1 } /protected override void Down\(/ { in_up=0 } in_up' "$route_migration")
          test -n "$route_migration_up"
          ! printf '%s\n' "$route_migration_up" | grep -Eiq 'migrationBuilder\.Sql|DropTable|city_minute_statistics|city_category_(minute|hour)_statistics|gtfs'

      - name: Validate city category capture is disabled by default
        run: |
          test "$(jq -r '.CityCategoryInsights.Enabled' src/Server/ChefKnifeStudios.TransitJazz.Server.WebAPI/appsettings.json)" = "false"
          test "$(jq -r '.CityCategoryInsights.DisabledCities | length' src/Server/ChefKnifeStudios.TransitJazz.Server.WebAPI/appsettings.json)" = "0"
          test "$(jq -r '.CityCategoryInsights.Enabled' src/Server/ChefKnifeStudios.TransitJazz.Server.TransitDataWorker/appsettings.json)" = "false"
          test "$(jq -r '.CityCategoryInsights.DisabledCities | length' src/Server/ChefKnifeStudios.TransitJazz.Server.TransitDataWorker/appsettings.json)" = "0"
          grep -q 'name: "city_category_minute_statistics"' src/Server/ChefKnifeStudios.TransitJazz.Server.Data/Migrations/20261001204629_CreateCityCategoryStatistics.cs
          grep -q 'name: "city_category_hour_statistics"' src/Server/ChefKnifeStudios.TransitJazz.Server.Data/Migrations/20261001204629_CreateCityCategoryStatistics.cs
          ! grep -Eiq 'migrationBuilder\.Sql|city_minute_statistics|gtfs|route' src/Server/ChefKnifeStudios.TransitJazz.Server.Data/Migrations/20261001204629_CreateCityCategoryStatistics.cs

      - name: Set image tag output
        id: set-tag
        run: echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Push images
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.MIGRATION_IMAGE_NAME }}:${{ github.sha }}

  deploy-linode:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: server-linode
    timeout-minutes: 45
    concurrency:
      group: transitjazz-production-deploy
      cancel-in-progress: false
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Resolve published image digest
        id: image
        env:
          RELEASE_TAG: ${{ needs.build-and-push.outputs.image-tag }}
        run: |
          set -euo pipefail
          ref="$REGISTRY/$IMAGE_NAME:$RELEASE_TAG"
          docker pull "$ref"
          full=$(docker image inspect "$ref" --format '{{index .RepoDigests 0}}')
          digest="${full##*@}"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Deploy to Linode
        env:
          DEPLOY_KEY: ${{ secrets.LINODE_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.LINODE_KNOWN_HOSTS }}
          LINODE_HOST: ${{ vars.LINODE_HOST }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/transitjazz_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          trap 'rm -f ~/.ssh/transitjazz_deploy' EXIT
          ssh -T -i ~/.ssh/transitjazz_deploy \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=6 \
            "tj-deploy@$LINODE_HOST" "deploy $DIGEST"
